<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Packliste - Paris & Barcelona</title>
    <meta name="description" content="Interaktive Reise-Packliste mit Fortschrittsanzeige">
    <meta name="theme-color" content="#1e293b">
    <link rel="manifest" href="data:application/json,{}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            min-height: 100dvh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Header - sticky */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #1e293b;
            padding: 16px 20px;
            border-bottom: 1px solid #334155;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        /* Progress */
        .progress-container {
            padding: 12px 20px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 76px;
            z-index: 99;
        }

        .progress-bar {
            background: #334155;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #22c55e, #16a34a);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .progress-percent {
            font-weight: 700;
            font-size: 1.125rem;
            color: #22c55e;
        }

        /* Reset Button */
        .reset-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            touch-action: manipulation;
        }

        .reset-btn:active {
            background: #b91c1c;
            transform: scale(0.98);
        }

        /* Content */
        .content {
            padding-bottom: 40px;
        }

        /* Section */
        .section {
            border-bottom: 1px solid #334155;
        }

        .section-header {
            background: #1e293b;
            padding: 14px 20px;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 8px;
            position: sticky;
            top: 130px;
            z-index: 50;
        }

        .section-header .icon {
            font-size: 1rem;
        }

        .section-content {
            background: #0f172a;
        }

        /* Checklist Item - grosse Touch-Targets */
        .item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #1e293b;
            cursor: pointer;
            touch-action: manipulation;
            transition: background 0.15s ease;
            min-height: 56px;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item:active {
            background: #1e293b;
        }

        .item.checked {
            opacity: 0.5;
        }

        .item.checked .item-text {
            text-decoration: line-through;
            color: #64748b;
        }

        /* Custom Checkbox */
        .checkbox {
            width: 24px;
            height: 24px;
            min-width: 24px;
            border: 2px solid #475569;
            border-radius: 6px;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .item.checked .checkbox {
            background: #22c55e;
            border-color: #22c55e;
        }

        .checkbox svg {
            width: 14px;
            height: 14px;
            stroke: white;
            stroke-width: 3;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.15s ease;
        }

        .item.checked .checkbox svg {
            opacity: 1;
            transform: scale(1);
        }

        .item-text {
            flex: 1;
            font-size: 1rem;
            line-height: 1.4;
            color: #e2e8f0;
        }

        /* Hidden real checkbox */
        .item input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        /* Desktop */
        @media (min-width: 640px) {
            body {
                display: flex;
                justify-content: center;
                padding: 40px 20px;
                background: #020617;
            }

            .container {
                max-width: 480px;
                width: 100%;
                background: #0f172a;
                border-radius: 16px;
                overflow: hidden;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            }

            .header {
                position: relative;
                top: auto;
                border-radius: 16px 16px 0 0;
            }

            .progress-container {
                position: relative;
                top: auto;
            }

            .section-header {
                position: relative;
                top: auto;
            }

            .item:hover {
                background: #1e293b;
            }
        }

        /* PWA Install Banner verstecken */
        @media (display-mode: standalone) {
            .header p {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Packliste</h1>
            <p>Paris & Barcelona</p>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text">
                <span><span id="checkedCount">0</span> von <span id="totalCount">0</span></span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </div>
        </div>

        <div class="content" id="checklistContent"></div>

        <div style="padding: 20px; text-align: center;">
            <button class="reset-btn" onclick="resetAll()">Alles zurücksetzen</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'packliste-v2';

        const checklistData = [
            {
                title: 'Dokumente & Essentials',
                icon: '📄',
                items: [
                    'Reisepass / Ausweis',
                    'Portemonnaie (Karten + Bargeld)',
                    'Handy',
                    'Reisedokumente (Flug, Hotel, Buchungen)'
                ]
            },
            {
                title: 'Technik',
                icon: '🔌',
                items: [
                    'Handy-Ladegerät',
                    'Powerbank',
                    'EU-Adapter',
                    'Kopfhörer / AirPods',
                    'Laptop',
                    'Laptop-Ladegerät',
                    'Kindle / iPad (optional)'
                ]
            },
            {
                title: 'Kleidung',
                icon: '👕',
                items: [
                    '3x T-Shirts',
                    '1x Hemd (für abends)',
                    '1x Hoodie / leichte Jacke',
                    '1x Jeans / Chino',
                    '1x Shorts',
                    '4x Unterwäsche',
                    '4x Socken',
                    '1x Pyjama / Schlafshorts',
                    '1x Gürtel',
                    '1x Badehose (Barcelona)',
                    'Sneakers (anziehen)',
                    'Sandalen (optional)'
                ]
            },
            {
                title: 'Toilettenartikel',
                icon: '🧴',
                items: [
                    'Zahnbürste',
                    'Zahnpasta (klein)',
                    'Gesichtsreiniger',
                    'Feuchtigkeitscreme',
                    'Deo',
                    'Parfum (klein)',
                    'Lippenbalsam',
                    'Rasierer',
                    'Kamm / Bürste',
                    'Sonnencreme (mini)'
                ]
            },
            {
                title: 'Sonstiges',
                icon: '🎒',
                items: [
                    'Sonnenbrille',
                    'Crossbody-Bag / Rucksack',
                    'Medikamente / Schmerzmittel',
                    'Wasserflasche (leer am Flughafen)',
                    'Snacks',
                    'Kugelschreiber',
                    'Regenschirm (mini)',
                    'Stoffbeutel'
                ]
            },
            {
                title: 'Vor der Abreise',
                icon: '✅',
                items: [
                    'Alle Tickets & Bestätigungen checken',
                    'Digitale + gedruckte Backups',
                    'Transport zum Hotel planen',
                    'Hoteladresse + Check-in-Info speichern',
                    'Check-in / Check-out Zeiten prüfen',
                    'Wetter checken'
                ]
            }
        ];

        function generateId(sectionIndex, itemIndex) {
            return `item-${sectionIndex}-${itemIndex}`;
        }

        function renderChecklist() {
            const content = document.getElementById('checklistContent');
            const savedState = loadState();

            let html = '';
            let totalItems = 0;

            checklistData.forEach((section, sectionIndex) => {
                html += `
                    <div class="section">
                        <div class="section-header">
                            <span class="icon">${section.icon}</span>
                            ${section.title}
                        </div>
                        <div class="section-content">
                `;

                section.items.forEach((item, itemIndex) => {
                    const id = generateId(sectionIndex, itemIndex);
                    const isChecked = savedState[id] || false;
                    totalItems++;

                    html += `
                        <label class="item ${isChecked ? 'checked' : ''}" data-id="${id}">
                            <input type="checkbox" ${isChecked ? 'checked' : ''}>
                            <div class="checkbox">
                                <svg viewBox="0 0 24 24" fill="none">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                            <span class="item-text">${item}</span>
                        </label>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            content.innerHTML = html;
            document.getElementById('totalCount').textContent = totalItems;

            // Event listeners
            document.querySelectorAll('.item').forEach(item => {
                item.addEventListener('click', handleItemClick);
            });

            updateProgress();
        }

        function handleItemClick(e) {
            const item = e.currentTarget;
            const checkbox = item.querySelector('input[type="checkbox"]');

            // Toggle
            checkbox.checked = !checkbox.checked;
            item.classList.toggle('checked', checkbox.checked);

            saveState();
            updateProgress();
        }

        function updateProgress() {
            const checkboxes = document.querySelectorAll('.item input[type="checkbox"]');
            const total = checkboxes.length;
            const checked = document.querySelectorAll('.item input[type="checkbox"]:checked').length;
            const percent = total > 0 ? Math.round((checked / total) * 100) : 0;

            document.getElementById('checkedCount').textContent = checked;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressPercent').textContent = percent + '%';

            // Farbe ändern bei 100%
            const fill = document.getElementById('progressFill');
            if (percent === 100) {
                fill.style.background = 'linear-gradient(90deg, #22c55e, #10b981)';
            } else {
                fill.style.background = 'linear-gradient(90deg, #22c55e, #16a34a)';
            }
        }

        function saveState() {
            const state = {};
            document.querySelectorAll('.item').forEach(item => {
                const id = item.dataset.id;
                const checkbox = item.querySelector('input[type="checkbox"]');
                state[id] = checkbox.checked;
            });

            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.warn('localStorage nicht verfügbar');
            }
        }

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : {};
            } catch (e) {
                return {};
            }
        }

        function resetAll() {
            if (confirm('Wirklich alles zurücksetzen?')) {
                try {
                    localStorage.removeItem(STORAGE_KEY);
                } catch (e) {}
                renderChecklist();
            }
        }

        // Keyboard shortcut
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'C') {
                e.preventDefault();
                resetAll();
            }
        });

        // Init
        renderChecklist();
    </script>
</body>
</html>
