<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Packliste - Paris & Barcelona</title>
    <meta name="description" content="Interaktive Reise-Packliste mit Fortschrittsanzeige">
    <meta name="theme-color" content="#f5f0e8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f0e8;
            color: #2c2c2c;
            min-height: 100vh;
            min-height: 100dvh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            background: #fffdf9;
            box-shadow: 0 0 60px rgba(0,0,0,0.08);
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #fffdf9;
            padding: 24px 20px 16px;
            border-bottom: 1px solid #e8e2d9;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #1a1a1a;
        }

        .header p {
            font-size: 0.9rem;
            color: #8c8577;
        }

        /* Progress */
        .progress-container {
            padding: 16px 20px;
            background: #fffdf9;
            border-bottom: 1px solid #e8e2d9;
            position: sticky;
            top: 85px;
            z-index: 99;
        }

        .progress-bar {
            background: #e8e2d9;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            background: #2c2c2c;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 3px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 0.85rem;
            color: #8c8577;
        }

        .progress-percent {
            font-weight: 600;
            font-size: 0.85rem;
            color: #2c2c2c;
        }

        /* Content */
        .content {
            padding: 8px 0;
        }

        /* Section */
        .section {
            padding: 0 20px;
        }

        .section-header {
            padding: 20px 0 12px;
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #8c8577;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #e8e2d9;
        }

        .section-header .icon {
            font-size: 1rem;
        }

        .section-header .count {
            margin-left: auto;
            font-weight: 500;
            font-size: 0.7rem;
            color: #b0a89c;
        }

        /* Checklist Item */
        .item {
            display: flex;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid #f0ebe3;
            cursor: pointer;
            touch-action: manipulation;
            transition: opacity 0.2s ease;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item:active {
            opacity: 0.7;
        }

        .item.checked {
            opacity: 0.45;
        }

        .item.checked .item-text {
            text-decoration: line-through;
            color: #a09a90;
        }

        /* Custom Checkbox */
        .checkbox {
            width: 22px;
            height: 22px;
            min-width: 22px;
            border: 2px solid #d0c9be;
            border-radius: 6px;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            background: #fffdf9;
        }

        .item.checked .checkbox {
            background: #2c2c2c;
            border-color: #2c2c2c;
        }

        .checkbox svg {
            width: 12px;
            height: 12px;
            stroke: #fffdf9;
            stroke-width: 3;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.15s ease;
        }

        .item.checked .checkbox svg {
            opacity: 1;
            transform: scale(1);
        }

        .item-text {
            flex: 1;
            font-size: 1rem;
            line-height: 1.4;
            color: #2c2c2c;
        }

        .item input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        /* Footer */
        .footer {
            padding: 32px 20px;
            text-align: center;
            border-top: 1px solid #e8e2d9;
            margin-top: 20px;
        }

        .reset-btn {
            background: transparent;
            color: #a09a90;
            border: 1px solid #d0c9be;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.2s ease;
        }

        .reset-btn:active {
            background: #f5f0e8;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #8c8577;
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .empty-state h2 {
            font-size: 1.25rem;
            color: #2c2c2c;
            margin-bottom: 8px;
            font-weight: 600;
        }

        /* Desktop */
        @media (min-width: 540px) {
            body {
                padding: 40px 20px;
            }

            .container {
                border-radius: 20px;
                min-height: auto;
                overflow: hidden;
            }

            .header {
                position: relative;
                top: auto;
            }

            .progress-container {
                position: relative;
                top: auto;
            }

            .item:hover {
                background: #faf7f2;
                margin: 0 -20px;
                padding-left: 20px;
                padding-right: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Packliste</h1>
            <p>Paris & Barcelona</p>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text">
                <span><span id="checkedCount">0</span> von <span id="totalCount">0</span> erledigt</span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </div>
        </div>

        <div class="content" id="checklistContent"></div>

        <div class="footer">
            <button class="reset-btn" onclick="resetAll()">Zurücksetzen</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'packliste-v4';

        const checklistData = [
            {
                title: 'Dokumente',
                icon: '📄',
                items: [
                    'Reisepass / Ausweis',
                    'Portemonnaie (Karten + Bargeld)',
                    'Handy',
                    'Reisedokumente (Flug, Hotel)'
                ]
            },
            {
                title: 'Technik',
                icon: '🔌',
                items: [
                    'Handy-Ladegerät',
                    'Powerbank',
                    'EU-Adapter',
                    'Kopfhörer',
                    'Laptop',
                    'Laptop-Ladegerät'
                ]
            },
            {
                title: 'Kleidung',
                icon: '👕',
                items: [
                    '3x T-Shirts',
                    '1x Hemd',
                    '1x Hoodie / Jacke',
                    '1x Jeans / Chino',
                    '1x Shorts',
                    '4x Unterwäsche',
                    '4x Socken',
                    '1x Pyjama',
                    '1x Gürtel',
                    '1x Badehose',
                    'Sneakers',
                    'Sandalen'
                ]
            },
            {
                title: 'Toilettenartikel',
                icon: '🧴',
                items: [
                    'Zahnbürste & Zahnpasta',
                    'Gesichtspflege',
                    'Deo',
                    'Parfum',
                    'Rasierer',
                    'Sonnencreme'
                ]
            },
            {
                title: 'Sonstiges',
                icon: '🎒',
                items: [
                    'Sonnenbrille',
                    'Rucksack / Tasche',
                    'Medikamente',
                    'Wasserflasche',
                    'Regenschirm'
                ]
            },
            {
                title: 'Vor Abreise',
                icon: '✓',
                items: [
                    'Tickets checken',
                    'Hotel-Adresse speichern',
                    'Wetter checken'
                ]
            }
        ];

        let state = {};

        function generateId(sectionIndex, itemIndex) {
            return `item-${sectionIndex}-${itemIndex}`;
        }

        function renderChecklist() {
            const content = document.getElementById('checklistContent');
            state = loadState();

            let html = '';
            let totalItems = 0;
            let checkedItems = 0;

            checklistData.forEach((section, sectionIndex) => {
                let sectionChecked = 0;
                section.items.forEach((_, itemIndex) => {
                    const id = generateId(sectionIndex, itemIndex);
                    if (state[id]) sectionChecked++;
                });

                const remaining = section.items.length - sectionChecked;

                html += `
                    <div class="section">
                        <div class="section-header">
                            <span class="icon">${section.icon}</span>
                            ${section.title}
                            <span class="count">${remaining > 0 ? remaining + ' offen' : '✓'}</span>
                        </div>
                `;

                section.items.forEach((item, itemIndex) => {
                    const id = generateId(sectionIndex, itemIndex);
                    const isChecked = state[id] || false;
                    totalItems++;
                    if (isChecked) checkedItems++;

                    html += `
                        <label class="item ${isChecked ? 'checked' : ''}" data-id="${id}">
                            <input type="checkbox" ${isChecked ? 'checked' : ''}>
                            <div class="checkbox">
                                <svg viewBox="0 0 24 24" fill="none">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                            <span class="item-text">${item}</span>
                        </label>
                    `;
                });

                html += `</div>`;
            });

            // Empty state if all done
            if (checkedItems === totalItems && totalItems > 0) {
                html = `
                    <div class="empty-state">
                        <div class="icon">✓</div>
                        <h2>Alles gepackt</h2>
                        <p>Gute Reise!</p>
                    </div>
                ` + html;
            }

            content.innerHTML = html;

            document.getElementById('totalCount').textContent = totalItems;
            document.getElementById('checkedCount').textContent = checkedItems;

            const percent = totalItems > 0 ? Math.round((checkedItems / totalItems) * 100) : 0;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressPercent').textContent = percent + '%';

            // Event listeners
            document.querySelectorAll('.item').forEach(item => {
                item.addEventListener('click', handleItemClick);
            });
        }

        function handleItemClick(e) {
            e.preventDefault();
            const item = e.currentTarget;
            const id = item.dataset.id;
            const checkbox = item.querySelector('input[type="checkbox"]');

            checkbox.checked = !checkbox.checked;
            item.classList.toggle('checked', checkbox.checked);
            state[id] = checkbox.checked;

            saveState();
            updateCounts();
        }

        function updateCounts() {
            let total = 0;
            let checked = 0;

            checklistData.forEach((section, sectionIndex) => {
                let sectionChecked = 0;
                section.items.forEach((_, itemIndex) => {
                    const id = generateId(sectionIndex, itemIndex);
                    total++;
                    if (state[id]) {
                        checked++;
                        sectionChecked++;
                    }
                });

                const remaining = section.items.length - sectionChecked;
                const countEl = document.querySelectorAll('.section')[sectionIndex]?.querySelector('.count');
                if (countEl) {
                    countEl.textContent = remaining > 0 ? remaining + ' offen' : '✓';
                }
            });

            document.getElementById('totalCount').textContent = total;
            document.getElementById('checkedCount').textContent = checked;

            const percent = total > 0 ? Math.round((checked / total) * 100) : 0;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressPercent').textContent = percent + '%';
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {}
        }

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : {};
            } catch (e) {
                return {};
            }
        }

        function resetAll() {
            if (confirm('Alles zurücksetzen?')) {
                state = {};
                try {
                    localStorage.removeItem(STORAGE_KEY);
                } catch (e) {}
                renderChecklist();
            }
        }

        // Init
        renderChecklist();
    </script>
</body>
</html>
